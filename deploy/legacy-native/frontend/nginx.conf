server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-store" always; }
  location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
  location /api/ {
    proxy_pass http://api:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header Cache-Control "no-store" always;
    client_max_body_size 20m;
  }
  location /docs { proxy_pass http://api:8000/docs; add_header Cache-Control "no-store" always; }
  location /openapi.json { proxy_pass http://api:8000/openapi.json; add_header Cache-Control "no-store" always; }
}
