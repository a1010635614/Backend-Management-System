services:
  db:
    image: ${POSTGRES_TEST_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_USER: blog_ci
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: blog_ci
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog_ci -d blog_ci"]
      interval: 3s
      timeout: 3s
      retries: 30
  tests:
    build: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg://blog_ci:ci-only-password@db:5432/blog_ci
      TEST_DATABASE_URL: postgresql+psycopg://blog_ci:ci-only-password@db:5432/blog_ci
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && alembic check && python -m unittest discover -s tests -v"]
