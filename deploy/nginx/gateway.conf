worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    include /tmp/blog-trusted-proxy.conf;
    real_ip_header X-Real-IP;
    real_ip_recursive off;
    map $http_x_forwarded_proto $forwarded_proto { default $scheme; https https; }
    map $upstream_http_referrer_policy $blog_referrer_policy {
        default $upstream_http_referrer_policy;
        "" strict-origin-when-cross-origin;
    }
    upstream blog_api { server backend:8000; }
    upstream blog_web { server frontend-web:8080; }
    upstream blog_admin { server frontend-admin:8080; }
    server {
        listen 8080;
        server_name _;
        client_max_body_size 1m;
        add_header X-Content-Type-Options nosniff always;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        add_header Referrer-Policy $blog_referrer_policy always;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 30s;
        location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
        location /api/ { proxy_pass http://blog_api; }
        location = /docs { proxy_pass http://blog_api; }
        location = /openapi.json { proxy_pass http://blog_api; }
        location = /admin { return 301 /admin/; }
        location /admin/ { proxy_pass http://blog_admin/; }
        location / { proxy_pass http://blog_web; }
    }
}
